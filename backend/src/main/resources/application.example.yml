spring:
  application:
    name: second-memory-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/memory}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:CHANGE_ME}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

server:
  port: ${SERVER_PORT:8081}
  # Trust X-Forwarded-For from the local nginx so per-IP rate limits see the real client.
  forward-headers-strategy: native
  servlet:
    encoding:
      charset: UTF-8
      force-response: true

memory:
  storage:
    provider: ${MEMORY_STORAGE_PROVIDER:local}
    audio-directory: ${AUDIO_STORAGE_DIR:./data/audio}
    s3:
      bucket: ${MEMORY_STORAGE_S3_BUCKET:}
      region: ${MEMORY_STORAGE_S3_REGION:ap-south-1}

  auth:
    jwt:
      secret: ${AUTH_JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_VALUE}
      expiry-minutes: ${AUTH_JWT_EXPIRY_MINUTES:43200}
    bootstrap:
      username: ${AUTH_BOOTSTRAP_USERNAME:}
      password: ${AUTH_BOOTSTRAP_PASSWORD:}

  # Per-user limits protect the shared AI key. Calendar month / day boundaries are UTC.
  limits:
    monthly-audio-minutes: ${LIMIT_MONTHLY_AUDIO_MINUTES:120}
    max-recording-minutes: ${LIMIT_MAX_RECORDING_MINUTES:60}
    daily-ai-requests: ${LIMIT_DAILY_AI_REQUESTS:50}
    max-processing-attempts: ${LIMIT_MAX_PROCESSING_ATTEMPTS:3}
    global-daily-audio-minutes: ${LIMIT_GLOBAL_DAILY_AUDIO_MINUTES:600}
    login-failures-per-ip: ${LIMIT_LOGIN_FAILURES_PER_IP:10}
    login-window-minutes: ${LIMIT_LOGIN_WINDOW_MINUTES:15}
    registrations-per-ip: ${LIMIT_REGISTRATIONS_PER_IP:5}
    registration-window-minutes: ${LIMIT_REGISTRATION_WINDOW_MINUTES:60}

  ai:
    chat:
      provider: ${MEMORY_CHAT_PROVIDER:openai-compatible}
      base-url: ${MEMORY_CHAT_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
      api-key: ${MEMORY_CHAT_API_KEY:CHANGE_ME}
      model: ${MEMORY_CHAT_MODEL:gemini-3.6-flash}
      temperature: ${MEMORY_CHAT_TEMPERATURE:0.2}

    embedding:
      provider: ${MEMORY_EMBEDDING_PROVIDER:openai-compatible}
      base-url: ${MEMORY_EMBEDDING_BASE_URL:https://api.openai.com/v1}
      api-key: ${MEMORY_EMBEDDING_API_KEY:}
      model: ${MEMORY_EMBEDDING_MODEL:text-embedding-3-small}
      dimensions: ${MEMORY_EMBEDDING_DIMENSIONS:1536}

    transcription:
      provider: ${MEMORY_TRANSCRIPTION_PROVIDER:gemini}
      base-url: ${MEMORY_TRANSCRIPTION_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      api-key: ${MEMORY_TRANSCRIPTION_API_KEY:${memory.ai.chat.api-key}}
      model: ${MEMORY_TRANSCRIPTION_MODEL:gemini-3.6-flash}
      language: ${MEMORY_TRANSCRIPTION_LANGUAGE:}
