spring:
  application:
    name: second-memory-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/memory}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:CHANGE_ME}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

server:
  port: ${SERVER_PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      force-response: true

memory:
  storage:
    audio-directory: ${AUDIO_STORAGE_DIR:./data/audio}

  ai:
    chat:
      provider: ${MEMORY_CHAT_PROVIDER:openai-compatible}
      base-url: ${MEMORY_CHAT_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
      api-key: ${MEMORY_CHAT_API_KEY:CHANGE_ME}
      model: ${MEMORY_CHAT_MODEL:gemini-3.6-flash}
      temperature: ${MEMORY_CHAT_TEMPERATURE:0.2}

    embedding:
      provider: ${MEMORY_EMBEDDING_PROVIDER:openai-compatible}
      base-url: ${MEMORY_EMBEDDING_BASE_URL:https://api.openai.com/v1}
      api-key: ${MEMORY_EMBEDDING_API_KEY:}
      model: ${MEMORY_EMBEDDING_MODEL:text-embedding-3-small}
      dimensions: ${MEMORY_EMBEDDING_DIMENSIONS:1536}

    transcription:
      provider: ${MEMORY_TRANSCRIPTION_PROVIDER:gemini}
      base-url: ${MEMORY_TRANSCRIPTION_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      api-key: ${MEMORY_TRANSCRIPTION_API_KEY:${memory.ai.chat.api-key}}
      model: ${MEMORY_TRANSCRIPTION_MODEL:gemini-3.6-flash}
      language: ${MEMORY_TRANSCRIPTION_LANGUAGE:}
