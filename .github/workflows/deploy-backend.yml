name: Deploy backend to EC2

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        working-directory: backend
        run: ./mvnw -B package

      - name: Stage deploy artifacts
        run: |
          cp backend/target/second-memory-backend-*.jar app.jar
          cp backend/src/main/resources/application.example.yml application.yml

      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: |
            app.jar
            application.yml
          retention-days: 5

  deploy:
    needs: build
    runs-on: [self-hosted, mindcue]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar

      - name: Deploy with health-check rollback
        run: |
          set -e
          # Stop first, then swap the jar, then start - swapping a live jar with `cp` while the
          # old process still has it open truncates the file out from under it mid-shutdown and
          # causes flaky restarts.
          #
          # application.yml is gitignored (it's only a template here - application.example.yml,
          # placeholder ${VAR:default} mappings only, no secrets) and placed at /opt/mindcue so
          # Spring Boot picks it up as external config from the working directory. Without it the
          # CI-built jar has no application.yml at all (never checked out) and every ${DB_URL:...}
          # style placeholder has nowhere to resolve from.
          sudo systemctl stop mindcue.service
          sudo cp /opt/mindcue/app.jar /opt/mindcue/app.jar.previous
          sudo cp app.jar /opt/mindcue/app.jar
          sudo cp application.yml /opt/mindcue/application.yml
          sudo chown mindcue:mindcue /opt/mindcue/app.jar /opt/mindcue/application.yml
          sudo systemctl start mindcue.service

          for i in $(seq 1 20); do
            sleep 3
            if curl -sf http://localhost:8081/api/v1/health > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
          done

          echo "Health check failed after deploy - rolling back to previous jar"
          sudo systemctl stop mindcue.service
          sudo cp /opt/mindcue/app.jar.previous /opt/mindcue/app.jar
          sudo chown mindcue:mindcue /opt/mindcue/app.jar
          sudo systemctl start mindcue.service
          exit 1
